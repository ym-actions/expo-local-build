name: Expo Local Build

on:
  workflow_call:
    inputs:
      # ── What to build ───────────────────────────────────────────────────────
      profile:
        description: "EAS build profile from eas.json (e.g. development, preview, production)"
        required: false
        default: "production"
        type: string
      platform:
        description: "Platform to build: 'android' or 'ios' (iOS needs a macOS runner)"
        required: false
        default: "android"
        type: string
      working-directory:
        description: "Directory containing the Expo app (useful for monorepos)"
        required: false
        default: "."
        type: string
      build-args:
        description: "Extra arguments appended to eas build (e.g. --clear-cache)"
        required: false
        default: ""
        type: string
      environment:
        description: "GitHub environment to run the job in (enables environment secrets and protection rules)"
        required: false
        default: ""
        type: string

      # ── Build environment ───────────────────────────────────────────────────
      env:
        description: "Extra build-time environment variables, one KEY=VALUE per line (non-secret)"
        required: false
        default: ""
        type: string
      doppler-project:
        description: "Doppler project to load secrets from. Not needed with a service token (it is scoped to one config)"
        required: false
        default: ""
        type: string
      doppler-config:
        description: "Doppler config to load secrets from. Not needed with a service token (it is scoped to one config)"
        required: false
        default: ""
        type: string
      public-env-pattern:
        description: "Regex of variable names whose values are NOT masked in logs (they ship inside the app anyway)"
        required: false
        default: "^EXPO_PUBLIC_"
        type: string

      # ── Toolchain ───────────────────────────────────────────────────────────
      node-version:
        description: "Node version to use. 'auto' reads .nvmrc / .node-version, falling back to the latest LTS"
        required: false
        default: "auto"
        type: string
      package-manager:
        description: "Package manager: 'auto' (detected from packageManager field or lockfile), 'npm', 'pnpm', 'yarn' or 'bun'"
        required: false
        default: "auto"
        type: string
      install-command:
        description: "Command to install dependencies. 'auto' uses the detected package manager, 'none' skips it"
        required: false
        default: "auto"
        type: string
      java-version:
        description: "JDK version for Android builds"
        required: false
        default: "17"
        type: string
      eas-cli-version:
        description: "Version of eas-cli to install globally (ignored when a local eas-cli is used)"
        required: false
        default: "latest"
        type: string
      use-local-cli:
        description: "Use the eas-cli from the project's own dependencies (node_modules/.bin) instead of installing it globally. Falls back to a global install, with a warning, if it is not found"
        required: false
        default: "false"
        type: string

      # ── Performance ─────────────────────────────────────────────────────────
      android-architectures:
        description: "Android ABIs to compile, comma-separated (armeabi-v7a, arm64-v8a, x86, x86_64). Empty builds the project's default (usually all four). 'arm64-v8a' alone covers almost every real phone and cuts native compile time ~4x"
        required: false
        default: ""
        type: string
      cache:
        description: "Cache package manager downloads, Gradle (dependencies + build cache) and CocoaPods between runs"
        required: false
        default: "true"
        type: string
      cache-read-only:
        description: "Restore the Gradle and ccache caches without saving them: 'auto' (save only on the default branch, whose caches every branch and tag can read), 'true' or 'false'"
        required: false
        default: "auto"
        type: string
      ccache:
        description: "Compile C/C++ through ccache and keep its cache between runs. Speeds up repeat builds whose native code hasn't changed"
        required: false
        default: "false"
        type: string
      ccache-max-size:
        description: "Maximum size of the ccache cache (e.g. 2G)"
        required: false
        default: "2G"
        type: string
      gradle-jvmargs:
        description: "JVM args for the Gradle and Kotlin daemons. 'auto' sizes the heap to the runner's RAM with 1 GB of metaspace (the project template's 512 MB runs out on larger apps); a custom value sets org.gradle.jvmargs; 'project' keeps the project's own settings"
        required: false
        default: "auto"
        type: string
      free-disk-space:
        description: "On Linux runners, delete preinstalled toolchains the build doesn't need (.NET, Haskell, CodeQL, …) to make room for native builds"
        required: false
        default: "true"
        type: string

      # ── What to do with the build ───────────────────────────────────────────
      upload-artifact:
        description: "Upload the binary as a workflow artifact"
        required: false
        default: "true"
        type: string
      artifact-name:
        description: "Artifact and file name (without extension). 'auto' gives <slug>-<profile>-<version>-<sha>"
        required: false
        default: "auto"
        type: string
      retention-days:
        description: "Days to keep the uploaded artifact (0 uses the repository default)"
        required: false
        default: 14
        type: number
      github-release:
        description: "Attach the binary to a GitHub Release: 'auto' (only when triggered by a tag), 'true' or 'false'. Needs contents: write"
        required: false
        default: "false"
        type: string
      release-tag:
        description: "Tag of the release to attach to (defaults to the triggering tag)"
        required: false
        default: ""
        type: string
      submit:
        description: "Submit the binary to the store with eas submit after building (runs on EAS servers)"
        required: false
        default: "false"
        type: string
      submit-profile:
        description: "Submit profile from eas.json (defaults to the build profile)"
        required: false
        default: ""
        type: string
      submit-tracks:
        description: "Google Play tracks to submit to, comma-separated: internal, closed, open, production (or a custom track name). One eas submit runs per track with the same binary. Empty keeps the track set in the submit profile. Android only"
        required: false
        default: ""
        type: string
      submit-release-status:
        description: "Play release status for submit-tracks: completed, draft, halted or inProgress. Empty keeps the profile's value, or uses completed. Use draft while the app has never been released"
        required: false
        default: ""
        type: string

      # ── Firebase App Distribution ───────────────────────────────────────────
      firebase-distribute:
        description: "Upload the binary to Firebase App Distribution (needs the FIREBASE_SERVICE_ACCOUNT secret)"
        required: false
        default: "false"
        type: string
      firebase-app-id:
        description: "Firebase app ID (1:123:android:abc). 'auto' finds it in google-services.json / GoogleService-Info.plist by the package the profile builds"
        required: false
        default: "auto"
        type: string
      firebase-groups:
        description: "Tester group aliases to notify, comma-separated"
        required: false
        default: ""
        type: string
      firebase-testers:
        description: "Tester emails to notify, comma-separated"
        required: false
        default: ""
        type: string
      firebase-release-notes:
        description: "Release notes shown to testers. 'auto' uses the PR title or commit message, plus profile, version and commit"
        required: false
        default: "auto"
        type: string
      firebase-tools-version:
        description: "Version of firebase-tools used to upload"
        required: false
        default: "latest"
        type: string

      # ── Reporting ───────────────────────────────────────────────────────────
      comment-on-pr:
        description: "Post/update a sticky PR comment with a link to the build (and failures). Needs pull-requests: write"
        required: false
        default: "true"
        type: string
      build-name:
        description: "Label used in the job name, comments and summary (defaults to '<Platform> <profile>')"
        required: false
        default: ""
        type: string

      # ── Runner & checkout ───────────────────────────────────────────────────
      runs-on:
        description: "Runner label. 'auto' uses ubuntu-latest for Android and macos-latest for iOS"
        required: false
        default: "auto"
        type: string
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        default: 90
        type: number
      ref:
        description: "Git ref to check out (defaults to the ref that triggered the workflow)"
        required: false
        default: ""
        type: string
      submodules:
        description: "Check out submodules: 'false', 'true' or 'recursive'"
        required: false
        default: "false"
        type: string

    secrets:
      EXPO_TOKEN:
        description: "Expo access token (expo.dev → Account settings → Access tokens)"
        required: false
      DOPPLER_TOKEN:
        description: "Doppler token. A service token loads its config; a personal or service-account token also needs doppler-project and doppler-config"
        required: false
      BUILD_ENV:
        description: "Secret build-time environment variables, one KEY=VALUE per line (values are masked in logs)"
        required: false
      PLAY_SERVICE_ACCOUNT:
        description: "JSON key of a Google Play service account (Release manager). Optional: without it, eas submit uses the key stored on EAS (eas credentials)"
        required: false
      FIREBASE_SERVICE_ACCOUNT:
        description: "JSON key of a service account with the Firebase App Distribution Admin role. Can also come from Doppler / BUILD_ENV as FIREBASE_SERVICE_ACCOUNT"
        required: false

    outputs:
      artifact-path:
        description: "Path of the built binary on the runner (relative to the workspace)"
        value: ${{ jobs.build.outputs.artifact-path }}
      artifact-name:
        description: "Name of the uploaded workflow artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
      artifact-url:
        description: "Download URL of the uploaded workflow artifact"
        value: ${{ jobs.build.outputs.artifact-url }}
      build-type:
        description: "File type of the binary: apk, aab, ipa or tar.gz (iOS simulator)"
        value: ${{ jobs.build.outputs.build-type }}
      app-version:
        description: "App version from the Expo config"
        value: ${{ jobs.build.outputs.app-version }}
      release-url:
        description: "URL of the GitHub Release the binary was attached to"
        value: ${{ jobs.build.outputs.release-url }}
      build-seconds:
        description: "Duration of the eas build step, in seconds"
        value: ${{ jobs.build.outputs.build-seconds }}
      version-code:
        description: "Android versionCode / iOS build number of the binary (apk and ipa only)"
        value: ${{ jobs.build.outputs.version-code }}
      firebase-console-url:
        description: "Firebase console link to the App Distribution release"
        value: ${{ jobs.build.outputs.firebase-console-url }}
      firebase-testing-url:
        description: "Link testers can open to install the App Distribution release"
        value: ${{ jobs.build.outputs.firebase-testing-url }}

jobs:
  build:
    name: Build ${{ inputs.build-name || format('{0} {1}', inputs.platform, inputs.profile) }}
    runs-on: ${{ inputs.runs-on != 'auto' && inputs.runs-on || (inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}

    # No permissions block: the job inherits whatever the caller grants, so
    # optional features (PR comments, releases) don't force extra permissions.

    # One build per platform + profile + PR/branch at a time. Superseded PR builds
    # are cancelled; other builds are queued instead of being interrupted.
    concurrency:
      group: expo-local-build-${{ inputs.platform }}-${{ inputs.profile }}-${{ inputs.working-directory }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

    env:
      # Never block on corepack's "download pnpm/yarn?" confirmation in CI.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      EXPO_NO_TELEMETRY: "1"

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    outputs:
      artifact-path: ${{ steps.build.outputs.path }}
      artifact-name: ${{ steps.build.outputs.name }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      build-type: ${{ steps.build.outputs.type }}
      app-version: ${{ steps.build.outputs.version }}
      release-url: ${{ steps.release.outputs.url }}
      build-seconds: ${{ steps.build.outputs.seconds }}
      version-code: ${{ steps.build.outputs.version-code }}
      firebase-console-url: ${{ steps.firebase.outputs.console-url }}
      firebase-testing-url: ${{ steps.firebase.outputs.testing-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ inputs.submodules }}

      - name: Resolve Configuration
        id: config
        env:
          HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
          HAS_DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN != '' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          INPUT_NODE_VERSION: ${{ inputs.node-version }}
          INPUT_BUILD_NAME: ${{ inputs.build-name }}
          INPUT_RELEASE: ${{ inputs.github-release }}
          INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
          INPUT_ARCHS: ${{ inputs.android-architectures }}
          INPUT_CACHE_READ_ONLY: ${{ inputs.cache-read-only }}
          UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
          FIREBASE_DISTRIBUTE: ${{ inputs.firebase-distribute }}
          SUBMIT: ${{ inputs.submit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOPPLER_PROJECT: ${{ inputs.doppler-project }}
          DOPPLER_CONFIG: ${{ inputs.doppler-config }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

          # ── Credentials ──────────────────────────────────────────────────
          if [ "$HAS_EXPO_TOKEN" != "true" ]; then
            echo "::error title=Missing EXPO_TOKEN::Pass the EXPO_TOKEN secret to this workflow (see README). Local builds still need it to fetch credentials and app versions from EAS."
            if [ "$IS_FORK" = "true" ]; then
              echo "::error::This pull request comes from a fork, so repository secrets are not available to it."
            fi
            echo "::error::If the caller uses 'secrets: inherit' from another organization, no secrets are passed. Pass them explicitly instead: 'secrets: { EXPO_TOKEN: \${{ secrets.EXPO_TOKEN }} }'."
            exit 1
          fi
          if { [ -n "$DOPPLER_PROJECT" ] || [ -n "$DOPPLER_CONFIG" ]; } && [ "$HAS_DOPPLER_TOKEN" != "true" ]; then
            echo "::error title=Missing DOPPLER_TOKEN::doppler-project / doppler-config are set but no DOPPLER_TOKEN secret was passed."
            exit 1
          fi

          # ── Platform & profile ───────────────────────────────────────────
          case "$PLATFORM" in
            android|ios) ;;
            *) echo "::error::platform must be 'android' or 'ios' (got '$PLATFORM'). Call the workflow once per platform to build both."; exit 1 ;;
          esac
          if [ "$PLATFORM" = "ios" ] && [ "$RUNNER_OS" != "macOS" ]; then
            echo "::error title=iOS needs macOS::iOS builds need a macOS runner (got $RUNNER_OS). Leave runs-on as 'auto' or set it to a macOS label."
            exit 1
          fi
          if [ ! -f eas.json ]; then
            echo "::error title=eas.json not found::No eas.json in '$PWD'. Check working-directory."
            exit 1
          fi
          if ! jq -e --arg p "$PROFILE" '.build[$p]' eas.json >/dev/null; then
            echo "::error title=Unknown profile::eas.json has no build profile '$PROFILE'. Available: $(jq -r '.build | keys | join(", ")' eas.json)"
            exit 1
          fi

          # ── Labels ───────────────────────────────────────────────────────
          case "$PLATFORM" in android) PLATFORM_LABEL=Android ;; ios) PLATFORM_LABEL=iOS ;; esac
          BUILD_NAME="${INPUT_BUILD_NAME:-$PLATFORM_LABEL $PROFILE}"
          SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"

          # ── GitHub Release ───────────────────────────────────────────────
          RELEASE_TAG=""
          case "$INPUT_RELEASE" in
            false) ;;
            true|auto)
              if [ -n "$INPUT_RELEASE_TAG" ]; then
                RELEASE_TAG="$INPUT_RELEASE_TAG"
              elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
                RELEASE_TAG="$GITHUB_REF_NAME"
              elif [ "$INPUT_RELEASE" = "true" ]; then
                echo "::error::github-release is 'true' but this run wasn't triggered by a tag. Set release-tag, or use 'auto'."
                exit 1
              fi
              ;;
            *) echo "::error::github-release must be 'auto', 'true' or 'false' (got '$INPUT_RELEASE')"; exit 1 ;;
          esac

          # ── Destinations ─────────────────────────────────────────────────
          if [ "$UPLOAD_ARTIFACT" != "true" ] && [ -z "$RELEASE_TAG" ] && [ "$FIREBASE_DISTRIBUTE" != "true" ] && [ "$SUBMIT" != "true" ]; then
            echo "::warning title=The build goes nowhere::upload-artifact is off and no release, Firebase or store destination is enabled, so the binary will be discarded when the job ends."
          fi

          # ── Android architectures ────────────────────────────────────────
          ARCHS=""
          if [ -n "$INPUT_ARCHS" ]; then
            for arch in $(echo "$INPUT_ARCHS" | tr ',' ' '); do
              case "$arch" in
                armeabi-v7a|arm64-v8a|x86|x86_64) ARCHS="${ARCHS:+$ARCHS,}$arch" ;;
                *) echo "::error::Unknown Android architecture '$arch' (expected armeabi-v7a, arm64-v8a, x86 or x86_64)"; exit 1 ;;
              esac
            done
            [ "$PLATFORM" != "android" ] && echo "::notice::android-architectures is ignored for $PLATFORM builds."
          fi

          # ── Cache writes ─────────────────────────────────────────────────
          # GitHub scopes caches by ref: a branch or tag can read its own caches and the
          # default branch's. Caches saved from a tag or feature branch help no one else,
          # so by default only the default branch saves.
          case "$INPUT_CACHE_READ_ONLY" in
            true|false) CACHE_READ_ONLY="$INPUT_CACHE_READ_ONLY" ;;
            auto)
              if [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH:-main}" ]; then
                CACHE_READ_ONLY=false
              else
                CACHE_READ_ONLY=true
              fi
              ;;
            *) echo "::error::cache-read-only must be 'auto', 'true' or 'false' (got '$INPUT_CACHE_READ_ONLY')"; exit 1 ;;
          esac

          # ── Node version ─────────────────────────────────────────────────
          NODE_VERSION=""
          NODE_VERSION_FILE=""
          if [ "$INPUT_NODE_VERSION" = "auto" ]; then
            for f in .nvmrc .node-version "$GITHUB_WORKSPACE/.nvmrc" "$GITHUB_WORKSPACE/.node-version"; do
              if [ -f "$f" ]; then
                ABS="$(cd "$(dirname "$f")" && pwd)/$(basename "$f")"
                NODE_VERSION_FILE="${ABS#"$GITHUB_WORKSPACE"/}"
                break
              fi
            done
            [ -z "$NODE_VERSION_FILE" ] && NODE_VERSION="lts/*"
          else
            NODE_VERSION="$INPUT_NODE_VERSION"
          fi

          {
            echo "build-name=$BUILD_NAME"
            echo "doppler=$HAS_DOPPLER_TOKEN"
            echo "sha=$SHA"
            echo "release-tag=$RELEASE_TAG"
            echo "node-version=$NODE_VERSION"
            echo "node-version-file=$NODE_VERSION_FILE"
            echo "archs=$ARCHS"
            echo "cache-read-only=$CACHE_READ_ONLY"
          } >> "$GITHUB_OUTPUT"

          echo "Build:        $BUILD_NAME (profile '$PROFILE', $PLATFORM)"
          echo "Runner:       $RUNNER_OS"
          echo "Release tag:  ${RELEASE_TAG:-<none>}"
          echo "Node version: ${NODE_VERSION:-from $NODE_VERSION_FILE}"
          [ "$PLATFORM" = "android" ] && echo "ABIs:         ${ARCHS:-project default}"
          echo "Cache:        $([ "$CACHE_READ_ONLY" = "true" ] && echo "restore only" || echo "restore and save")"

      - name: Free Disk Space
        if: ${{ inputs.free-disk-space == 'true' && runner.os == 'Linux' }}
        working-directory: /
        run: |
          # Native Android builds for all ABIs can outgrow the default free space.
          # Keep the Android SDK, Java and Node; drop toolchains this build never uses.
          echo "Free before: $(df -h / | awk 'NR==2 {print $4}')"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/node_modules/@angular /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Free after:  $(df -h / | awk 'NR==2 {print $4}')"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.config.outputs.node-version }}
          node-version-file: ${{ steps.config.outputs.node-version-file }}
          # setup-node v5 auto-enables caching from the packageManager field, which
          # calls pnpm/yarn before they are installed. Caching is handled below.
          package-manager-cache: false

      - name: Detect Package Manager
        id: pm
        env:
          INPUT_PM: ${{ inputs.package-manager }}
          INPUT_INSTALL: ${{ inputs.install-command }}
        run: |
          set -euo pipefail

          # Find the nearest file walking up from working-directory to the repo root.
          find_up() {
            local dir="$PWD"
            while :; do
              [ -f "$dir/$1" ] && { echo "$dir/$1"; return 0; }
              { [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = "/" ]; } && return 1
              dir="$(dirname "$dir")"
            done
          }

          # ── Package manager ──────────────────────────────────────────────
          # The packageManager field usually lives in the monorepo root, so keep
          # walking up until a package.json that declares it is found.
          PM_SPEC=""
          DIR="$PWD"
          while :; do
            if [ -f "$DIR/package.json" ]; then
              PM_SPEC="$(PKG="$DIR/package.json" node -p "require(process.env.PKG).packageManager || ''")"
              [ -n "$PM_SPEC" ] && break
            fi
            { [ "$DIR" = "$GITHUB_WORKSPACE" ] || [ "$DIR" = "/" ]; } && break
            DIR="$(dirname "$DIR")"
          done

          if [ "$INPUT_PM" != "auto" ]; then
            PM="$INPUT_PM"
          elif [ -n "$PM_SPEC" ]; then
            PM="${PM_SPEC%%@*}"
          elif find_up bun.lock >/dev/null || find_up bun.lockb >/dev/null; then
            PM=bun
          elif find_up pnpm-lock.yaml >/dev/null; then
            PM=pnpm
          elif find_up yarn.lock >/dev/null; then
            PM=yarn
          else
            PM=npm
          fi

          case "$PM" in
            npm|pnpm|yarn|bun) ;;
            *) echo "::error::Unsupported package manager '$PM' (expected npm, pnpm, yarn or bun)"; exit 1 ;;
          esac

          # Make pnpm / yarn available (bun is installed by a dedicated step).
          # EAS runs its own install inside the build, so it must be on PATH either way.
          if [ "$PM" = "pnpm" ] || [ "$PM" = "yarn" ]; then
            if [ -n "$PM_SPEC" ] && [ "${PM_SPEC%%@*}" = "$PM" ] && corepack enable 2>/dev/null; then
              echo "Enabled $PM_SPEC via corepack"
            elif ! command -v "$PM" >/dev/null 2>&1; then
              echo "Installing $PM globally..."
              SPEC="$PM"
              [ "${PM_SPEC%%@*}" = "$PM" ] && SPEC="${PM_SPEC%%+*}"
              npm install -g "$SPEC" --no-fund --no-audit
            fi
          fi

          # ── Cache directory ──────────────────────────────────────────────
          case "$PM" in
            npm)  CACHE_DIR="$(npm config get cache)" ;;
            pnpm) CACHE_DIR="$(pnpm store path --silent)" ;;
            yarn)
              if [ "$(yarn --version | cut -d. -f1)" -ge 2 ]; then
                CACHE_DIR="$(yarn config get cacheFolder)"
              else
                CACHE_DIR="$(yarn cache dir)"
              fi
              ;;
            bun)  CACHE_DIR="$HOME/.bun/install/cache" ;;
          esac

          # ── Install command ──────────────────────────────────────────────
          # eas-cli reads the app config (app.config.ts, config plugins), which
          # needs the project's dependencies installed.
          case "$INPUT_INSTALL" in
            none|"") INSTALL="" ;;
            auto)
              case "$PM" in
                npm)
                  if find_up package-lock.json >/dev/null || find_up npm-shrinkwrap.json >/dev/null; then
                    INSTALL="npm ci"
                  else
                    INSTALL="npm install"
                  fi
                  ;;
                pnpm) INSTALL="pnpm install --frozen-lockfile" ;;
                yarn)
                  if [ "$(yarn --version | cut -d. -f1)" -ge 2 ]; then
                    INSTALL="yarn install --immutable"
                  else
                    INSTALL="yarn install --frozen-lockfile"
                  fi
                  ;;
                bun) INSTALL="bun install --frozen-lockfile" ;;
              esac
              ;;
            *) INSTALL="$INPUT_INSTALL" ;;
          esac

          {
            echo "name=$PM"
            echo "cache-dir=$CACHE_DIR"
            echo "install=$INSTALL"
          } >> "$GITHUB_OUTPUT"

          echo "Package manager: $PM${PM_SPEC:+ ($PM_SPEC)}"
          echo "Install:         ${INSTALL:-<skipped>}"

      - name: Setup Bun
        if: ${{ steps.pm.outputs.name == 'bun' }}
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        if: ${{ inputs.platform == 'android' }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}

      - name: Check Android SDK
        id: android-sdk
        if: ${{ inputs.platform == 'android' }}
        run: |
          if [ -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" ] && [ -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" ]; then
            echo "Android SDK found at ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "No Android SDK on this runner, installing it."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Android SDK
        if: ${{ steps.android-sdk.outputs.missing == 'true' }}
        uses: android-actions/setup-android@v3

      - name: Cache Dependencies
        if: ${{ inputs.cache == 'true' && steps.pm.outputs.install != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.pm.outputs.cache-dir }}
          key: ${{ runner.os }}-${{ steps.pm.outputs.name }}-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.pm.outputs.name }}-

      # Caches ~/.gradle (dependencies, wrapper, build cache) by content, prunes stale
      # entries before saving, and saves even when the build fails. EAS local builds
      # use ~/.gradle too, so everything they download or produce is covered.
      - name: Setup Gradle Cache
        if: ${{ inputs.platform == 'android' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.cache != 'true' }}
          cache-read-only: ${{ steps.config.outputs.cache-read-only == 'true' }}
          add-job-summary: on-failure

      - name: Cache CocoaPods
        if: ${{ inputs.cache == 'true' && inputs.platform == 'ios' }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install ccache
        if: ${{ inputs.ccache == 'true' }}
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "ccache already installed"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          fi
          ccache --version | head -n1

      - name: Restore ccache
        if: ${{ inputs.ccache == 'true' }}
        uses: actions/cache/restore@v4
        with:
          # Same folder EAS cloud builds use for ccache.
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ccache' || '~/.cache/ccache' }}
          # ccache's contents change every run, so each save gets a new key and
          # restores pick the most recent one by prefix.
          key: ${{ runner.os }}-ccache-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.platform }}-

      - name: Setup Doppler CLI
        if: ${{ steps.config.outputs.doppler == 'true' }}
        uses: dopplerhq/cli-action@v3

      - name: Load Build Environment
        env:
          PLAIN_ENV: ${{ inputs.env }}
          SECRET_ENV: ${{ secrets.BUILD_ENV }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ inputs.doppler-project }}
          DOPPLER_CONFIG: ${{ inputs.doppler-config }}
          PUBLIC_PATTERN: ${{ inputs.public-env-pattern }}
        run: |
          set -euo pipefail

          # export_var SOURCE MASK KEY VALUE -> available to every later step.
          export_var() {
            local source="$1" mask="$2" key="$3" value="$4" delim
            if [ "$mask" = "true" ] && [ -n "$value" ]; then
              if [ -z "$PUBLIC_PATTERN" ] || ! [[ "$key" =~ $PUBLIC_PATTERN ]]; then
                # Mask each line separately so multi-line values (keys, JSON) stay hidden.
                while IFS= read -r part; do
                  [ -n "$part" ] && echo "::add-mask::$part"
                done <<< "$value"
              fi
            fi
            delim="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delim" "$value" "$delim" >> "$GITHUB_ENV"
            echo "Loaded $key from $source"
          }

          # Parse KEY=VALUE lines.
          load_env() {
            local source="$1" mask="$2" content="$3" line key value
            [ -z "$content" ] && return 0
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              [[ -z "${line// }" || "$line" =~ ^[[:space:]]*# ]] && continue
              line="${line#export }"
              if [[ ! "$line" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
                echo "::error::Invalid line in $source (expected KEY=VALUE)"
                exit 1
              fi
              key="${BASH_REMATCH[1]}"
              value="${BASH_REMATCH[2]}"
              # Strip one pair of matching surrounding quotes.
              if [[ "$value" =~ ^\"(.*)\"$ || "$value" =~ ^\'(.*)\'$ ]]; then
                value="${BASH_REMATCH[1]}"
              fi
              export_var "$source" "$mask" "$key" "$value"
            done <<< "$content"
          }

          # Later sources override earlier ones: Doppler < env input < BUILD_ENV.
          if [ -n "$DOPPLER_TOKEN" ]; then
            args=(secrets download --no-file --format json)
            [ -n "$DOPPLER_PROJECT" ] && args+=(--project "$DOPPLER_PROJECT")
            [ -n "$DOPPLER_CONFIG" ] && args+=(--config "$DOPPLER_CONFIG")
            JSON="$(doppler "${args[@]}")"
            echo "Doppler: $(echo "$JSON" | jq -r '"\(.DOPPLER_PROJECT // "?") / \(.DOPPLER_CONFIG // "?")"')"
            while IFS= read -r key; do
              # Doppler's own metadata (project/config names) isn't secret.
              if [[ "$key" == DOPPLER_* ]]; then mask=false; else mask=true; fi
              export_var "Doppler" "$mask" "$key" "$(echo "$JSON" | jq -r --arg k "$key" '.[$k]')"
            done < <(echo "$JSON" | jq -r 'keys[]')
          fi
          load_env "env input" false "$PLAIN_ENV"
          load_env "BUILD_ENV secret" true "$SECRET_ENV"

      - name: Configure Native Build
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCHS: ${{ steps.config.outputs.archs }}
          CACHE: ${{ inputs.cache }}
          CCACHE: ${{ inputs.ccache }}
          CCACHE_MAX: ${{ inputs.ccache-max-size }}
          JVMARGS: ${{ inputs.gradle-jvmargs }}
        run: |
          set -euo pipefail

          if [ "$PLATFORM" = "android" ]; then
            # Gradle project properties can be set through ORG_GRADLE_PROJECT_* env vars,
            # which reach the app and every library module.
            if [ -n "$ARCHS" ]; then
              echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=$ARCHS" >> "$GITHUB_ENV"
              echo "Building ABIs: $ARCHS"
            fi

            # User-level gradle.properties applies to every build without touching the
            # project (which would change its fingerprint). EAS cloud does the same.
            mkdir -p ~/.gradle
            if [ "$CACHE" = "true" ]; then
              printf '\norg.gradle.caching=true\n' >> ~/.gradle/gradle.properties
              echo "Enabled the Gradle build cache"
            fi
            # User-level properties win over the project's gradle.properties. The Expo/RN
            # template's -Xmx2048m -XX:MaxMetaspaceSize=512m is sized for laptops building
            # one ABI and runs out of metaspace (and hangs) on larger apps.
            case "$JVMARGS" in
              project|"") echo "Keeping the project's Gradle JVM settings" ;;
              auto)
                if [ "$RUNNER_OS" = "macOS" ]; then
                  RAM_MB=$(( $(sysctl -n hw.memsize) / 1024 / 1024 ))
                else
                  RAM_MB=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) / 1024 ))
                fi
                # Leave the rest for clang/ninja (native code) and Metro.
                GRADLE_MB=$(( RAM_MB * 40 / 100 )); [ "$GRADLE_MB" -gt 8192 ] && GRADLE_MB=8192
                KOTLIN_MB=$(( RAM_MB * 25 / 100 )); [ "$KOTLIN_MB" -gt 4096 ] && KOTLIN_MB=4096
                [ "$GRADLE_MB" -lt 2048 ] && GRADLE_MB=2048
                [ "$KOTLIN_MB" -lt 1024 ] && KOTLIN_MB=1024
                COMMON="-XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
                {
                  printf '\norg.gradle.jvmargs=-Xmx%dm %s\n' "$GRADLE_MB" "$COMMON"
                  printf 'kotlin.daemon.jvmargs=-Xmx%dm %s\n' "$KOTLIN_MB" "$COMMON"
                } >> ~/.gradle/gradle.properties
                echo "Runner RAM ${RAM_MB} MB → Gradle heap ${GRADLE_MB} MB, Kotlin daemon ${KOTLIN_MB} MB, metaspace 1 GB each"
                ;;
              *)
                printf '\norg.gradle.jvmargs=%s\n' "$JVMARGS" >> ~/.gradle/gradle.properties
                echo "org.gradle.jvmargs=$JVMARGS"
                ;;
            esac
          fi

          if [ "$CCACHE" = "true" ]; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              CCACHE_DIR="$HOME/Library/Caches/ccache"
            else
              CCACHE_DIR="$HOME/.cache/ccache"
            fi
            mkdir -p "$CCACHE_DIR"
            {
              echo "CCACHE_DIR=$CCACHE_DIR"
              echo "CCACHE_MAXSIZE=$CCACHE_MAX"
              # EAS builds in a fixed folder under RUNNER_TEMP; make paths inside it
              # relative so hits don't depend on where the runner put it.
              echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build"
              # RelWithDebInfo compiles with -g, which otherwise hashes the working dir.
              echo "CCACHE_NOHASHDIR=true"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            } >> "$GITHUB_ENV"
            if [ "$PLATFORM" = "android" ]; then
              # CMake reads these as the default compiler launcher for every project,
              # including library modules React Native's own ccache hook doesn't cover.
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            else
              # React Native's pod setup routes compilation through ccache when set.
              echo "USE_CCACHE=1" >> "$GITHUB_ENV"
            fi
            CCACHE_DIR="$CCACHE_DIR" ccache --zero-stats >/dev/null
            echo "ccache enabled ($CCACHE_DIR, max $CCACHE_MAX)"
          fi

      - name: Install Dependencies
        if: ${{ steps.pm.outputs.install != '' }}
        env:
          INSTALL_COMMAND: ${{ steps.pm.outputs.install }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Set Up EAS CLI
        id: cli
        env:
          CLI_VERSION: ${{ inputs.eas-cli-version }}
          USE_LOCAL: ${{ inputs.use-local-cli }}
          PM: ${{ steps.pm.outputs.name }}
        run: |
          set -euo pipefail

          # Look for a locally installed CLI, walking up to the repo root so that
          # hoisted monorepo dependencies are found too.
          LOCAL_BIN=""
          if [ "$USE_LOCAL" = "true" ]; then
            DIR="$PWD"
            while :; do
              if [ -x "$DIR/node_modules/.bin/eas" ]; then
                LOCAL_BIN="$DIR/node_modules/.bin"
                break
              fi
              { [ "$DIR" = "$GITHUB_WORKSPACE" ] || [ "$DIR" = "/" ]; } && break
              DIR="$(dirname "$DIR")"
            done
          fi

          if [ -n "$LOCAL_BIN" ]; then
            echo "$LOCAL_BIN" >> "$GITHUB_PATH"
            export PATH="$LOCAL_BIN:$PATH"
            echo "source=local" >> "$GITHUB_OUTPUT"
            echo "Using local eas-cli from $LOCAL_BIN"
            [ "$CLI_VERSION" != "latest" ] && echo "::notice::eas-cli-version is ignored because the local eas-cli is used."
          else
            if [ "$USE_LOCAL" = "true" ]; then
              case "$PM" in
                pnpm) ADD="pnpm add -D eas-cli" ;;
                yarn) ADD="yarn add -D eas-cli" ;;
                bun)  ADD="bun add -d eas-cli" ;;
                *)    ADD="npm install --save-dev eas-cli" ;;
              esac
              echo "source=global-fallback" >> "$GITHUB_OUTPUT"
              echo "install-hint=$ADD" >> "$GITHUB_OUTPUT"
              echo "::warning title=eas-cli not found locally::use-local-cli is enabled but eas-cli is not in node_modules/.bin, so it is being installed globally (slower). Add it to your project: $ADD"
            else
              echo "source=global" >> "$GITHUB_OUTPUT"
            fi
            npm install -g "eas-cli@$CLI_VERSION" --no-fund --no-audit
          fi
          eas --version

      # Runs before the build so a missing key or unregistered app fails in seconds,
      # not after a 20-minute build.
      - name: Resolve Firebase App
        id: firebase-app
        if: ${{ inputs.firebase-distribute == 'true' }}
        env:
          SA_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          INPUT_APP_ID: ${{ inputs.firebase-app-id }}
          GROUPS: ${{ inputs.firebase-groups }}
          TESTERS: ${{ inputs.firebase-testers }}
        run: |
          set -euo pipefail

          # ── Credentials ──────────────────────────────────────────────────
          # The secret wins; otherwise accept FIREBASE_SERVICE_ACCOUNT loaded from Doppler / BUILD_ENV.
          SA="${SA_SECRET:-${FIREBASE_SERVICE_ACCOUNT:-}}"
          if [ -z "$SA" ]; then
            echo "::error title=Missing FIREBASE_SERVICE_ACCOUNT::firebase-distribute is on but no service account key was found. Pass the FIREBASE_SERVICE_ACCOUNT secret (see README)."
            exit 1
          fi
          if ! echo "$SA" | jq -e '.type == "service_account" and (.client_email | type == "string")' >/dev/null 2>&1; then
            echo "::error title=Invalid FIREBASE_SERVICE_ACCOUNT::FIREBASE_SERVICE_ACCOUNT must be the full JSON key of a Google Cloud service account (it starts with {\"type\": \"service_account\", ...})."
            exit 1
          fi
          echo "Service account: $(echo "$SA" | jq -r .client_email)"
          if [ -z "$GROUPS" ] && [ -z "$TESTERS" ]; then
            echo "::warning title=No Firebase testers::Neither firebase-groups nor firebase-testers is set, so the release will be uploaded but nobody will be notified."
          fi

          # ── App ID ───────────────────────────────────────────────────────
          if [ "$INPUT_APP_ID" != "auto" ] && [ -n "$INPUT_APP_ID" ]; then
            echo "app-id=$INPUT_APP_ID" >> "$GITHUB_OUTPUT"
            echo "Firebase app: $INPUT_APP_ID (from firebase-app-id)"
            exit 0
          fi

          # Read the app config the way this profile sees it: its eas.json env (following
          # `extends`) can change the package name, e.g. APP_VARIANT=preview → *.preview.
          CONFIG="$(node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const chain = [];
            const seen = new Set();
            for (let p = process.env.PROFILE; p && !seen.has(p) && eas.build && eas.build[p]; p = eas.build[p].extends) {
              seen.add(p);
              chain.unshift(eas.build[p]);
            }
            const env = Object.assign({}, ...chain.map((b) => b.env || {}));
            process.stdout.write(execFileSync("npx", ["--no-install", "expo", "config", "--json", "--type", "public"], {
              env: { ...process.env, ...env },
              stdio: ["ignore", "pipe", "inherit"],
            }));
          ')"

          if [ "$PLATFORM" = "android" ]; then
            ID="$(echo "$CONFIG" | jq -r '.android.package // empty')"
            FILE="$(echo "$CONFIG" | jq -r '.android.googleServicesFile // "google-services.json"')"
            if [ -z "$ID" ]; then
              echo "::error title=No Android package::The app config has no android.package, so the Firebase app can't be found. Set firebase-app-id."
              exit 1
            fi
            if [ ! -f "$FILE" ]; then
              echo "::error title=google-services.json not found::'$FILE' doesn't exist, so the Firebase app ID can't be looked up. Add it (android.googleServicesFile) or set firebase-app-id."
              exit 1
            fi
            APP_ID="$(jq -r --arg p "$ID" '[.client[] | select(.client_info.android_client_info.package_name == $p) | .client_info.mobilesdk_app_id][0] // empty' "$FILE")"
            if [ -z "$APP_ID" ]; then
              echo "::error title=Firebase app not found::No app with package '$ID' in $FILE. Register it in the Firebase console (Project settings → Add app), download the new google-services.json, or set firebase-app-id. Packages in the file: $(jq -r '[.client[].client_info.android_client_info.package_name] | join(", ")' "$FILE")"
              exit 1
            fi
          else
            ID="$(echo "$CONFIG" | jq -r '.ios.bundleIdentifier // empty')"
            FILE="$(echo "$CONFIG" | jq -r '.ios.googleServicesFile // "GoogleService-Info.plist"')"
            if [ ! -f "$FILE" ]; then
              echo "::error title=GoogleService-Info.plist not found::'$FILE' doesn't exist, so the Firebase app ID can't be looked up. Add it (ios.googleServicesFile) or set firebase-app-id."
              exit 1
            fi
            APP_ID="$(plutil -extract GOOGLE_APP_ID raw "$FILE" 2>/dev/null || true)"
            PLIST_BUNDLE="$(plutil -extract BUNDLE_ID raw "$FILE" 2>/dev/null || true)"
            if [ -z "$APP_ID" ] || { [ -n "$ID" ] && [ "$PLIST_BUNDLE" != "$ID" ]; }; then
              echo "::error title=Firebase app not found::$FILE is for '$PLIST_BUNDLE', but this profile builds '$ID'. Use the plist for that bundle ID, or set firebase-app-id."
              exit 1
            fi
          fi

          echo "app-id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Firebase app: $APP_ID ($ID, from $FILE)"

      - name: Build
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          BUILD_ARGS: ${{ inputs.build-args }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          SHA: ${{ steps.config.outputs.sha }}
        run: |
          set -euo pipefail

          # Read slug and version for naming. Never fatal: naming falls back to the repo.
          CONFIG="$(npx --no-install expo config --json --type public 2>/dev/null || echo '{}')"
          SLUG="$(echo "$CONFIG" | jq -r '.slug // empty' 2>/dev/null || true)"
          VERSION="$(echo "$CONFIG" | jq -r '.version // empty' 2>/dev/null || true)"
          SLUG="${SLUG:-${GITHUB_REPOSITORY#*/}}"

          # Build outside the workspace so nothing leaks into the checkout.
          export EAS_LOCAL_BUILD_WORKINGDIR="$RUNNER_TEMP/eas-build"
          export EAS_LOCAL_BUILD_ARTIFACTS_DIR="$RUNNER_TEMP/eas-artifacts"
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR" "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"

          args=(build --local --non-interactive --platform "$PLATFORM" --profile "$PROFILE")
          if [ -n "$BUILD_ARGS" ]; then
            read -r -a extra <<< "$BUILD_ARGS"
            args+=("${extra[@]}")
          fi

          echo "::group::eas ${args[*]}"
          BUILD_START=$(date +%s)
          eas "${args[@]}"
          BUILD_SECONDS=$(( $(date +%s) - BUILD_START ))
          echo "::endgroup::"
          echo "seconds=$BUILD_SECONDS" >> "$GITHUB_OUTPUT"

          # Pick up the binary EAS produced (apk / aab / ipa, or tar.gz for simulator builds).
          FILE="$(find "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" -maxdepth 1 -type f \
            \( -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name '*.tar.gz' \) \
            -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2- || true)"
          if [ -z "$FILE" ]; then
            # BSD find (macOS) has no -printf.
            FILE="$(ls -t "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"/*.{apk,aab,ipa,tar.gz} 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$FILE" ]; then
            echo "::error title=No build output::eas build finished but no apk/aab/ipa/tar.gz was found in $EAS_LOCAL_BUILD_ARTIFACTS_DIR."
            ls -la "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
            exit 1
          fi
          case "$FILE" in
            *.tar.gz) TYPE=tar.gz ;;
            *) TYPE="${FILE##*.}" ;;
          esac

          slugify() { echo "$1" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//'; }
          if [ "$INPUT_ARTIFACT_NAME" = "auto" ] || [ -z "$INPUT_ARTIFACT_NAME" ]; then
            NAME="$(slugify "$SLUG-$PROFILE${VERSION:+-$VERSION}-${SHA:0:7}")"
          else
            NAME="$(slugify "$INPUT_ARTIFACT_NAME")"
          fi

          OUT_DIR="$GITHUB_WORKSPACE/.expo-local-build"
          mkdir -p "$OUT_DIR"
          DEST="$OUT_DIR/$NAME.$TYPE"
          mv "$FILE" "$DEST"
          SIZE="$(du -h "$DEST" | cut -f1)"

          # Build number of the binary (remote app versions are bumped by EAS during the build,
          # so the config doesn't know it). Best effort: apk via aapt2, ipa via its Info.plist.
          VERSION_CODE=""
          case "$TYPE" in
            apk)
              AAPT2="$(ls -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n1 || true)"
              if [ -n "$AAPT2" ]; then
                VERSION_CODE="$("$AAPT2" dump badging "$DEST" 2>/dev/null | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -n1 || true)"
              fi
              ;;
            ipa)
              PLIST="$(mktemp)"
              if unzip -p "$DEST" 'Payload/*.app/Info.plist' > "$PLIST" 2>/dev/null; then
                VERSION_CODE="$(plutil -extract CFBundleVersion raw "$PLIST" 2>/dev/null || true)"
              fi
              rm -f "$PLIST"
              ;;
          esac

          {
            echo "path=${DEST#"$GITHUB_WORKSPACE"/}"
            echo "name=$NAME"
            echo "type=$TYPE"
            echo "version=$VERSION"
            echo "version-code=$VERSION_CODE"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Build complete::$NAME.$TYPE ($SIZE)${VERSION:+, version $VERSION}${VERSION_CODE:+ ($VERSION_CODE)}"

      - name: Collect Cache Stats
        id: cache-stats
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        env:
          CCACHE: ${{ inputs.ccache }}
        run: |
          size() { [ -d "$1" ] && du -sh "$1" 2>/dev/null | cut -f1 || echo "-"; }
          {
            echo "gradle=$(size ~/.gradle/caches)"
            echo "gradle-build-cache=$(size ~/.gradle/caches/build-cache-1)"
          } >> "$GITHUB_OUTPUT"
          if [ "$CCACHE" = "true" ] && command -v ccache >/dev/null 2>&1; then
            # Hit rate for this run only (stats were zeroed before the build).
            STATS="$(ccache --print-stats 2>/dev/null || true)"
            stat() { echo "$STATS" | awk -v k="$1" '$1 == k {v = $2} END {print v + 0}'; }
            HITS=$(( $(stat direct_cache_hit) + $(stat preprocessed_cache_hit) ))
            MISSES=$(stat cache_miss)
            TOTAL=$(( HITS + MISSES ))
            RATE="-"
            [ "$TOTAL" -gt 0 ] && RATE="$(( HITS * 100 / TOTAL ))%"
            {
              echo "ccache-hits=$HITS"
              echo "ccache-total=$TOTAL"
              echo "ccache-rate=$RATE"
              echo "ccache-size=$(size "$CCACHE_DIR")"
            } >> "$GITHUB_OUTPUT"
            echo "::group::ccache stats"
            ccache --show-stats || true
            echo "::endgroup::"
            if [ "$TOTAL" -eq 0 ]; then
              echo "::warning title=ccache saw no compilations::ccache is enabled but no C/C++ compile went through it. The build may not honour CMAKE_*_COMPILER_LAUNCHER (Android) or USE_CCACHE (iOS)."
            fi
          fi
          echo "Gradle caches: $(size ~/.gradle/caches) (build cache $(size ~/.gradle/caches/build-cache-1))"

      - name: Save ccache
        if: ${{ always() && inputs.ccache == 'true' && steps.config.outputs.cache-read-only != 'true' && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ccache' || '~/.cache/ccache' }}
          key: ${{ runner.os }}-ccache-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Artifact
        id: upload
        if: ${{ inputs.upload-artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ github.workspace }}/${{ steps.build.outputs.path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          # Binaries are already compressed.
          compression-level: 0

      - name: Attach to GitHub Release
        id: release
        if: ${{ steps.config.outputs.release-tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.release-tag }}
          files: ${{ github.workspace }}/${{ steps.build.outputs.path }}
          fail_on_unmatched_files: true

      - name: Distribute with Firebase
        id: firebase
        if: ${{ inputs.firebase-distribute == 'true' && steps.build.outcome == 'success' }}
        env:
          SA_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_ID: ${{ steps.firebase-app.outputs.app-id }}
          FILE: ${{ github.workspace }}/${{ steps.build.outputs.path }}
          TYPE: ${{ steps.build.outputs.type }}
          GROUPS: ${{ inputs.firebase-groups }}
          TESTERS: ${{ inputs.firebase-testers }}
          INPUT_NOTES: ${{ inputs.firebase-release-notes }}
          TOOLS_VERSION: ${{ inputs.firebase-tools-version }}
          PROFILE: ${{ inputs.profile }}
          VERSION: ${{ steps.build.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version-code }}
          SHA: ${{ steps.config.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ "$TYPE" = "tar.gz" ]; then
            echo "::error title=Can't distribute a simulator build::Firebase App Distribution needs an .ipa. Use a profile that builds for devices."
            exit 1
          fi

          # Write the key to a private temp file for the duration of this step only.
          CREDS="$RUNNER_TEMP/firebase-sa-$(openssl rand -hex 6).json"
          trap 'rm -f "$CREDS"' EXIT
          (umask 077 && printf '%s' "${SA_SECRET:-${FIREBASE_SERVICE_ACCOUNT:-}}" > "$CREDS")
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"

          # ── Release notes ────────────────────────────────────────────────
          NOTES_FILE="$RUNNER_TEMP/firebase-release-notes.txt"
          if [ "$INPUT_NOTES" = "auto" ]; then
            if [ -n "$PR_NUMBER" ]; then
              SUMMARY="PR #$PR_NUMBER: $PR_TITLE"
            elif [ -n "$HEAD_COMMIT_MESSAGE" ]; then
              SUMMARY="$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -n1)"
            else
              SUMMARY="$(git log -1 --format=%s 2>/dev/null || true)"
            fi
            {
              [ -n "$SUMMARY" ] && printf '%s\n\n' "$SUMMARY"
              printf '%s · %s%s · %s@%s\n' "$PROFILE" "${VERSION:-?}" "${VERSION_CODE:+ ($VERSION_CODE)}" "$GITHUB_REF_NAME" "${SHA:0:7}"
            } > "$NOTES_FILE"
          else
            printf '%s\n' "$INPUT_NOTES" > "$NOTES_FILE"
          fi
          echo "::group::Release notes"
          cat "$NOTES_FILE"
          echo "::endgroup::"

          # ── Upload ───────────────────────────────────────────────────────
          args=(appdistribution:distribute "$FILE" --app "$APP_ID" --release-notes-file "$NOTES_FILE")
          [ -n "$GROUPS" ] && args+=(--groups "$GROUPS")
          [ -n "$TESTERS" ] && args+=(--testers "$TESTERS")

          OUT="$RUNNER_TEMP/firebase-distribute.log"
          set +e
          npx --yes "firebase-tools@$TOOLS_VERSION" "${args[@]}" 2>&1 | tee "$OUT"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            if [ "$TYPE" = "aab" ]; then
              echo "::error title=Firebase rejected the app bundle::Distributing .aab files needs the Firebase project linked to Google Play (Project settings → Integrations → Google Play), and the app must exist in Play Console. Distribute an APK profile instead, or link Play."
            fi
            if grep -qiE 'permission|403|forbidden' "$OUT"; then
              echo "::error title=Firebase permission denied::Give the service account the 'Firebase App Distribution Admin' role in Google Cloud IAM, for the project that owns app $APP_ID."
            fi
            if grep -qiE '404|not found' "$OUT"; then
              echo "::error title=Firebase app not found::Check that app $APP_ID exists, that App Distribution is enabled (Firebase console → App Distribution → Get started), and that the service account belongs to the same project."
            fi
            exit "$STATUS"
          fi

          CLEAN="$(sed -E 's/\x1b\[[0-9;]*m//g' "$OUT")"
          CONSOLE_URL="$(echo "$CLEAN" | grep -oE 'https://console\.firebase\.google\.com/[^ ]+' | head -n1 || true)"
          TESTING_URL="$(echo "$CLEAN" | grep -oE 'https://appdistribution\.firebase(\.google)?\.(com|dev)/[^ ]+' | head -n1 || true)"
          {
            echo "console-url=$CONSOLE_URL"
            echo "testing-url=$TESTING_URL"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Sent to Firebase App Distribution::${GROUPS:+groups: $GROUPS }${TESTERS:+testers: $TESTERS }${CONSOLE_URL}"

      - name: Submit to Store
        id: submit
        if: ${{ inputs.submit == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT_PROFILE: ${{ inputs.submit-profile || inputs.profile }}
          TRACKS: ${{ inputs.submit-tracks }}
          RELEASE_STATUS: ${{ inputs.submit-release-status }}
          FILE: ${{ github.workspace }}/${{ steps.build.outputs.path }}
          FILE_TYPE: ${{ steps.build.outputs.type }}
        run: |
          set -euo pipefail

          if [ -z "$TRACKS" ]; then
            eas submit --non-interactive --platform "$PLATFORM" --profile "$SUBMIT_PROFILE" --path "$FILE"
            exit 0
          fi

          if [ "$PLATFORM" != "android" ]; then
            echo "::error title=submit-tracks is Android only::Google Play tracks don't apply to $PLATFORM. Leave submit-tracks empty."
            exit 1
          fi
          if [ "$FILE_TYPE" != "aab" ]; then
            echo "::error title=Google Play needs an .aab::This build is an .$FILE_TYPE. Use a profile that builds an app bundle (no buildType: apk) when submitting to tracks."
            exit 1
          fi
          if ! jq -e --arg p "$SUBMIT_PROFILE" '.submit[$p]' eas.json >/dev/null; then
            echo "::error title=Unknown submit profile::eas.json has no submit profile '$SUBMIT_PROFILE'. Add \"submit\": { \"$SUBMIT_PROFILE\": {} }."
            exit 1
          fi

          # Optional Play key from the workflow secret; otherwise EAS uses the one stored on its servers.
          KEY_PATH=""
          if [ -n "$PLAY_SA" ]; then
            if ! echo "$PLAY_SA" | jq -e '.type == "service_account"' >/dev/null 2>&1; then
              echo "::error title=Invalid PLAY_SERVICE_ACCOUNT::It must be the full JSON key of a Google Cloud service account."
              exit 1
            fi
            KEY_PATH="$RUNNER_TEMP/play-service-account.json"
            (umask 077 && printf '%s' "$PLAY_SA" > "$KEY_PATH")
          else
            echo "::notice title=No PLAY_SERVICE_ACCOUNT::Using the Google Play key stored on EAS. If submit fails with 'Google Service Account Keys cannot be set up in --non-interactive mode', none is stored: run 'eas credentials' (Android → Google Service Account Key for Play Store Submissions) or pass the PLAY_SERVICE_ACCOUNT secret."
          fi

          cp eas.json "$RUNNER_TEMP/eas.json.orig"
          trap 'cp "$RUNNER_TEMP/eas.json.orig" eas.json; [ -z "$KEY_PATH" ] || rm -f "$KEY_PATH"' EXIT

          SUBMITTED=""
          FAILED=""
          IFS=',' read -ra LIST <<< "$TRACKS"
          for RAW in "${LIST[@]}"; do
            NAME="$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            [ -n "$NAME" ] || continue
            case "$NAME" in
              internal)   TRACK=internal ;;
              closed)     TRACK=alpha ;;
              open)       TRACK=beta ;;
              production) TRACK=production ;;
              *)          TRACK="$NAME" ;; # custom closed track, used as-is
            esac

            # A throwaway submit profile: the chosen profile plus this track.
            TMP_PROFILE="_track_$TRACK"
            jq --arg p "$SUBMIT_PROFILE" --arg t "$TMP_PROFILE" --arg track "$TRACK" \
               --arg status "$RELEASE_STATUS" --arg key "$KEY_PATH" '
              .submit[$t] = .submit[$p]
              | .submit[$t].android.track = $track
              | .submit[$t].android.releaseStatus = (if $status != "" then $status else (.submit[$p].android.releaseStatus // "completed") end)
              | if $key != "" then .submit[$t].android.serviceAccountKeyPath = $key else . end
            ' "$RUNNER_TEMP/eas.json.orig" > eas.json

            echo "::group::Submit to Google Play: $NAME (track: $TRACK)"
            if eas submit --non-interactive --platform android --profile "$TMP_PROFILE" --path "$FILE"; then
              SUBMITTED="${SUBMITTED:+$SUBMITTED, }$NAME"
            else
              FAILED="${FAILED:+$FAILED, }$NAME"
              echo "::error title=Submit to $NAME failed::eas submit failed for track '$TRACK'. If the log says a Google Service Account Key cannot be set up, no Play key is available: add the PLAY_SERVICE_ACCOUNT secret or store one on EAS. Otherwise check that the track exists in Play Console and that the version code is higher than any release on it."
            fi
            echo "::endgroup::"
          done

          echo "tracks=$SUBMITTED" >> "$GITHUB_OUTPUT"
          [ -z "$FAILED" ] || { echo "::error::Failed tracks: $FAILED"; exit 1; }

      - name: Write Job Summary
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          NAME: ${{ steps.config.outputs.build-name }}
          FILE_NAME: ${{ steps.build.outputs.name }}.${{ steps.build.outputs.type }}
          SIZE: ${{ steps.build.outputs.size }}
          VERSION: ${{ steps.build.outputs.version }}
          PROFILE: ${{ inputs.profile }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SUBMITTED: ${{ steps.submit.outcome == 'success' }}
          SUBMITTED_TRACKS: ${{ steps.submit.outputs.tracks }}
          VERSION_CODE: ${{ steps.build.outputs.version-code }}
          FIREBASE_OUTCOME: ${{ steps.firebase.outcome }}
          FIREBASE_CONSOLE: ${{ steps.firebase.outputs.console-url }}
          FIREBASE_TESTING: ${{ steps.firebase.outputs.testing-url }}
          FIREBASE_GROUPS: ${{ inputs.firebase-groups }}
          SHA: ${{ steps.config.outputs.sha }}
          STARTED: ${{ steps.config.outputs.started }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          ARCHS: ${{ steps.config.outputs.archs }}
          PLATFORM: ${{ inputs.platform }}
          CACHE_READ_ONLY: ${{ steps.config.outputs.cache-read-only }}
          GRADLE_SIZE: ${{ steps.cache-stats.outputs.gradle }}
          GRADLE_BUILD_CACHE: ${{ steps.cache-stats.outputs.gradle-build-cache }}
          CCACHE_RATE: ${{ steps.cache-stats.outputs.ccache-rate }}
          CCACHE_HITS: ${{ steps.cache-stats.outputs.ccache-hits }}
          CCACHE_TOTAL: ${{ steps.cache-stats.outputs.ccache-total }}
          CCACHE_SIZE: ${{ steps.cache-stats.outputs.ccache-size }}
        run: |
          fmt() { printf '%dm %02ds' $(( $1 / 60 )) $(( $1 % 60 )); }
          TOTAL_SECONDS=$(( $(date +%s) - STARTED ))
          {
            echo "### 📦 $NAME build"
            echo ""
            echo "| | |"
            echo "| :-- | :-- |"
            echo "| **File** | \`$FILE_NAME\` ($SIZE) |"
            echo "| **Profile** | \`$PROFILE\` |"
            [ -n "$VERSION" ] && echo "| **Version** | $VERSION${VERSION_CODE:+ ($VERSION_CODE)} |"
            [ -n "$ARTIFACT_URL" ] && echo "| **Download** | [Workflow artifact]($ARTIFACT_URL) |"
            [ -n "$RELEASE_URL" ] && echo "| **Release** | $RELEASE_URL |"
            if [ "$FIREBASE_OUTCOME" = "success" ]; then
              LINKS=""
              [ -n "$FIREBASE_CONSOLE" ] && LINKS="[Console]($FIREBASE_CONSOLE)"
              [ -n "$FIREBASE_TESTING" ] && LINKS="${LINKS:+$LINKS · }[Tester link]($FIREBASE_TESTING)"
              echo "| **Firebase** | Distributed${FIREBASE_GROUPS:+ to \`$FIREBASE_GROUPS\`}${LINKS:+ · $LINKS} |"
            elif [ "$FIREBASE_OUTCOME" = "failure" ]; then
              echo "| **Firebase** | ❌ Distribution failed (see the step log) |"
            fi
            [ "$SUBMITTED" = "true" ] && echo "| **Store** | Submitted with \`eas submit\`${SUBMITTED_TRACKS:+ to Google Play: $SUBMITTED_TRACKS} |"
            echo "| **Commit** | \`${SHA:0:7}\` |"
            echo ""
            echo "#### ⏱️ Performance"
            echo ""
            echo "| | |"
            echo "| :-- | :-- |"
            echo "| **eas build** | $(fmt "${BUILD_SECONDS:-0}") |"
            echo "| **Whole job** | $(fmt "$TOTAL_SECONDS") (so far) |"
            [ "$PLATFORM" = "android" ] && echo "| **ABIs** | ${ARCHS:-project default} |"
            [ "$PLATFORM" = "android" ] && echo "| **Gradle caches** | $GRADLE_SIZE (build cache $GRADLE_BUILD_CACHE) |"
            [ -n "$CCACHE_RATE" ] && echo "| **ccache** | $CCACHE_RATE hit rate ($CCACHE_HITS / $CCACHE_TOTAL compilations), $CCACHE_SIZE |"
            echo "| **Caches saved** | $([ "$CACHE_READ_ONLY" = "true" ] && echo "no (restore only, see \`cache-read-only\`)" || echo "yes") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report EAS CLI Fallback
        if: ${{ always() && steps.cli.outputs.source == 'global-fallback' }}
        env:
          HINT: ${{ steps.cli.outputs.install-hint }}
        run: |
          echo "::warning title=eas-cli was installed globally::use-local-cli is enabled but eas-cli was not found in the project's dependencies, so it was installed on every run. Install it locally to speed up builds: $HINT"
          {
            echo ""
            echo "> [!WARNING]"
            echo "> \`use-local-cli\` is enabled but \`eas-cli\` was not found in your project's dependencies, so it was installed globally on this run (slower)."
            echo "> Install it locally and commit the updated lockfile:"
            echo ">"
            echo "> \`\`\`sh"
            echo "> $HINT"
            echo "> \`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare PR Comment
        id: comment
        if: ${{ always() && github.event.pull_request.number && inputs.comment-on-pr == 'true' && steps.config.outcome == 'success' }}
        env:
          NAME: ${{ steps.config.outputs.build-name }}
          OUTCOME: ${{ steps.build.outcome }}
          FILE_NAME: ${{ steps.build.outputs.name }}.${{ steps.build.outputs.type }}
          SIZE: ${{ steps.build.outputs.size }}
          VERSION: ${{ steps.build.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version-code }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          FIREBASE_TESTING: ${{ steps.firebase.outputs.testing-url }}
          SHA: ${{ steps.config.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "body<<EOF_COMMENT"
            if [ "$OUTCOME" = "success" ]; then
              echo "### 📦 $NAME build is ready"
              echo ""
              echo "| | |"
              echo "| :-- | :-- |"
              if [ -n "$ARTIFACT_URL" ]; then
                echo "| **Download** | [\`$FILE_NAME\`]($ARTIFACT_URL) ($SIZE) |"
              else
                echo "| **File** | \`$FILE_NAME\` ($SIZE) |"
              fi
              [ -n "$VERSION" ] && echo "| **Version** | $VERSION${VERSION_CODE:+ ($VERSION_CODE)} |"
              [ -n "$FIREBASE_TESTING" ] && echo "| **Firebase** | [Install from App Distribution]($FIREBASE_TESTING) |"
              echo "| **Commit** | \`${SHA:0:7}\` |"
            else
              echo "### ❌ $NAME build failed"
              echo ""
              echo "The build for commit \`${SHA:0:7}\` did not complete. [View workflow logs]($RUN_URL)."
            fi
            echo "EOF_COMMENT"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR Comment
        if: ${{ always() && steps.comment.outputs.body != '' }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: expo-local-build-${{ inputs.platform }}-${{ inputs.profile }}-${{ inputs.working-directory }}
          message: ${{ steps.comment.outputs.body }}
